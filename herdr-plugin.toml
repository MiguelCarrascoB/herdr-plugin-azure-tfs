id = "miguel.azure-tfs"
name = "Azure TFS"
version = "0.1.0"
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[panes]]
id = "board"
title = "Azure TFS board"
command = ["node", "./commands/board.js"]
placement = "split"

[[panes]]
id = "preview"
title = "Azure TFS preview"
command = ["node", "./commands/preview.js"]
placement = "popup"

[[actions]]
id = "dispatch"
title = "Azure TFS: dispatch work item"
command = ["node", "./commands/dispatch.js"]

[[actions]]
id = "report"
title = "Azure TFS: report status"
command = ["node", "./commands/report.js"]

[[actions]]
id = "preview-link"
title = "Azure TFS: preview link"
command = ["node", "./commands/preview.js"]

[[link_handlers]]
id = "workitem-link"
title = "Azure TFS: work item link"
pattern = "^https?://[^/]+(?:/[^/]+)?/[^/]+/[^/]+/_workitems/edit/[0-9]+/?$"
action = "preview-link"

[[link_handlers]]
id = "pullrequest-link"
title = "Azure TFS: pull request link"
pattern = "^https?://[^/]+(?:/[^/]+)?/[^/]+/[^/]+/_git/[^/]+/pullrequest/[0-9]+/?$"
action = "preview-link"

[[startup]]
command = ["node", "./commands/startup.js"]

[[build]]
command = ["node", "--check", "commands/board.js"]
